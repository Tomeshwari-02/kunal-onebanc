  <!-- Inner Gold Frame -->
  <rect x="26" y="26" width="148" height="148" stroke="#bfa15f" stroke-width="2.5" fill="none" />
  
  <!-- Overlapping TT Serif Monogram -->
  <!-- Left T -->
